<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>불 끄기 대작전 · 선생님 기록장</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#fff8ec;color:#1d2433}
  header{background:#ff6a2b;color:#fff;padding:14px 18px;font-family:'Jua',sans-serif;font-size:26px}
  main{padding:14px;max-width:1100px;margin:auto}
  .box{background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  textarea{width:100%;height:70px;box-sizing:border-box;font-size:13px;border-radius:10px;border:2px solid #e8b27a;padding:8px}
  button{font-family:'Jua',sans-serif;font-size:17px;border:none;border-radius:12px;padding:9px 16px;background:#ff7a2f;color:#fff;margin:4px 4px 0 0;cursor:pointer}
  button.g{background:#8a94a6} button.b{background:#2f8fe6}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px} th,td{border-bottom:1px solid #eee;padding:7px 6px;text-align:center} th{background:#fff1dc;position:sticky;top:0}
  td.l{text-align:left} .ok{color:#14a37f;font-weight:700} .msg{color:#c94a14;font-weight:700;min-height:1.2em}
  video{width:100%;max-width:360px;border-radius:12px;display:block;margin-top:8px}
  .wrap{overflow:auto;max-height:60vh}
</style></head><body>
<header>📋 선생님 기록장 <small style="font-size:15px">불 끄기 대작전</small></header>
<main>
  <div class="box"><b>결과 코드 모으기</b>
    <p style="margin:6px 0;font-size:14px">학생 인증서의 QR을 <b>이 기기의 카메라 앱</b>으로 찍으면 자동으로 들어와요. 또는 결과 코드(GNF1.…)를 붙여 넣어요. 기록은 이 기기에만 저장돼요.</p>
    <textarea id="paste" placeholder="GNF1.로 시작하는 코드를 한 줄에 하나씩 붙여 넣기"></textarea>
    <button id="add">➕ 추가</button><button class="b" id="scan">📷 QR 스캔</button><span class="msg" id="msg"></span>
    <video id="vid" playsinline muted hidden></video>
  </div>
  <div class="box"><b>모둠(팀)별 합계</b><div class="wrap"><table id="teams" style="min-width:0"></table></div></div>
  <div class="box"><b>학생별 기록</b> <button id="csv">💾 CSV(엑셀) 받기</button><button class="g" id="clear">🗑 모두 지우기</button>
    <div class="wrap"><table id="tbl"></table></div></div>
  <p style="font-size:13px;color:#777">코스: 실외·실내·연수동·체험동·야외 · 퀴즈 = 첫 번째 시도에 맞힌 수 · ⏱ = 도전 모드 완주 시간(초)</p>
</main>
<script>
const CN = { out: '실외', in: '실내', yeonsu: '연수동', cheheom: '체험동', yaoe: '야외' }, MD = { easy: '쉬움', normal: '보통', challenge: '도전' };
const KEY = 'gnfire-teacher';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
const save = a => localStorage.setItem(KEY, JSON.stringify(a));
const $ = id => document.getElementById(id), msg = t => $('msg').textContent = t;
function decode(code) {
  const m = String(code).match(/GNF1\.([A-Za-z0-9_-]+)/); if (!m) return null;
  try { const b = atob(m[1].replace(/-/g, '+').replace(/_/g, '/')); const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); o.code = 'GNF1.' + m[1]; return o; } catch (e) { return null; }
}
function addCodes(text) {
  const a = load(); let n = 0, bad = 0;
  for (const line of String(text).split(/\s+/)) { if (!line.includes('GNF1.')) continue; const o = decode(line); if (!o) { bad++; continue; }
    const i = a.findIndex(x => x.n === o.n && x.t === o.t); if (i >= 0) { if ((o.e || 0) >= (a[i].e || 0)) a[i] = o; } else a.push(o); n++; }
  save(a); render(); msg(n ? `✅ ${n}명 기록을 넣었어요` + (bad ? ` (읽지 못한 코드 ${bad}개)` : '') : '코드를 찾지 못했어요');
}
const row = o => { const q = Object.values(o.q || {}); return { 이름: o.n || '(이름 없음)', 모둠: o.m || '', 난이도: MD[o.md] || '', '끈 불(곳)': (o.s || []).length, 퀴즈: `${q.filter(Boolean).length}/${q.length}`, 소화기연습: o.x ? 'O' : '', 완주코스: Object.keys(o.w || {}).map(k => CN[k] + (o.w[k] ? `⏱${o.w[k]}` : '')).join(' '), 시작: new Date(o.t).toLocaleString('ko-KR'), 마지막: new Date(o.e).toLocaleString('ko-KR') }; };
function render() {
  const a = load();
  const rows = a.map(row), H = ['이름', '모둠', '난이도', '끈 불(곳)', '퀴즈', '소화기연습', '완주코스', '시작', '마지막'];
  $('tbl').innerHTML = '<tr>' + H.map(h => `<th>${h}</th>`).join('') + '<th></th></tr>' + rows.map((r, i) => '<tr>' + H.map(h => `<td class="${h === '이름' || h === '완주코스' ? 'l' : ''}">${String(r[h]).replace(/</g, '&lt;')}</td>`).join('') + `<td><button class="g" data-i="${i}" style="font-size:13px;padding:4px 8px">삭제</button></td></tr>`).join('');
  $('tbl').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { if (!confirm('이 기록을 지울까요?')) return; const x = load(); x.splice(+b.dataset.i, 1); save(x); render(); });
  const T = {}; for (const o of a) { const k = o.m || '(모둠 없음)'; const t = T[k] = T[k] || { 인원: 0, 불: 0, 맞힘: 0, 문항: 0, 완주: 0 }; const q = Object.values(o.q || {}); t.인원++; t.불 += (o.s || []).length; t.맞힘 += q.filter(Boolean).length; t.문항 += q.length; t.완주 += Object.keys(o.w || {}).length; }
  $('teams').innerHTML = '<tr><th>모둠</th><th>인원</th><th>끈 불 합계</th><th>퀴즈 정답률</th><th>완주 코스 수</th></tr>' + Object.entries(T).sort((x, y) => y[1].불 - x[1].불).map(([k, t]) => `<tr><td class="l">${k.replace(/</g, '&lt;')}</td><td>${t.인원}</td><td class="ok">${t.불}</td><td>${t.문항 ? Math.round(t.맞힘 / t.문항 * 100) + '%' : '-'}</td><td>${t.완주}</td></tr>`).join('');
  window.__rows = rows;
}
$('add').onclick = () => { addCodes($('paste').value); $('paste').value = ''; };
$('csv').onclick = () => { const r = window.__rows || []; if (!r.length) return msg('기록이 없어요'); const H = Object.keys(r[0]);
  const esc = v => `"${String(v).replace(/"/g, '""')}"`; const csv = '﻿' + [H.map(esc).join(','), ...r.map(x => H.map(h => esc(x[h])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `불끄기_기록_${new Date().toISOString().slice(0, 10)}.csv`; a.click(); };
$('clear').onclick = () => { if (confirm('모든 기록을 지울까요? (먼저 CSV를 받아 두세요)')) { save([]); render(); } };
$('scan').onclick = async () => {
  if (!('BarcodeDetector' in window)) return msg('이 브라우저는 스캔을 지원하지 않아요. 기본 카메라 앱으로 QR을 찍어 주세요.');
  const v = $('vid'); try { v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { return msg('카메라를 켤 수 없어요'); }
  v.hidden = false; await v.play(); const det = new BarcodeDetector({ formats: ['qr_code'] }); msg('QR을 화면에 비춰 주세요');
  const seen = new Set(); const tick = async () => { if (v.hidden) return; try { for (const c of await det.detect(v)) if (!seen.has(c.rawValue)) { seen.add(c.rawValue); addCodes(c.rawValue); } } catch (e) { } setTimeout(tick, 300); }; tick();
  $('scan').textContent = '⏹ 스캔 멈추기'; $('scan').onclick = () => { v.hidden = true; v.srcObject.getTracks().forEach(t => t.stop()); location.reload(); };
};
if (location.hash.includes('GNF1.')) { addCodes(decodeURIComponent(location.hash)); history.replaceState(null, '', location.pathname); } else render();
</script>
</body></html>
